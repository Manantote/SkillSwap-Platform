<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View user profile on Skill Swap">
  <title>User Profile — Skill Swap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-arrow-left-right me-2"></i>SkillSwap</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCollapse">
        <i class="bi bi-list fs-4" style="color:var(--text)"></i>
      </button>
      <div class="collapse navbar-collapse" id="navCollapse">
        <ul class="navbar-nav mx-auto gap-1">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="matches.html">Matches</a></li>
          <li class="nav-item"><a class="nav-link" href="requests.html">Requests</a></li>
          <li class="nav-item"><a class="nav-link" href="reviews.html">Reviews</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <button class="dark-toggle" aria-label="Toggle theme"></button>
          <i id="themeIcon" class="bi bi-moon-fill" style="color:var(--text-muted);font-size:.9rem"></i>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page header -->
  <div class="page-header text-white text-center">
    <div class="container">
      <h1 class="fw-800 mb-2"><i class="bi bi-person-badge me-2"></i>User Profile</h1>
      <p style="opacity:.85" id="headerSubtext">View member details and skills</p>
    </div>
  </div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div id="loader" class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <div class="mt-3 text-muted">Loading profile...</div>
        </div>

        <div id="errorDisplay" class="alert alert-danger d-none fade-up text-center">
          <i class="bi bi-exclamation-triangle-fill fs-4 d-block mb-2"></i>
          <div id="errorMsg">User not found</div>
          <a href="dashboard.html" class="btn btn-sm btn-outline-danger mt-3">Return to Dashboard</a>
        </div>

        <div id="profileContent" class="d-none fade-up">
          <!-- Main Info Card -->
          <div class="card-custom p-4 mb-4 text-center">
            <div class="position-relative d-inline-block mb-3">
              <div id="profileInitial" class="avatar-placeholder mx-auto"
                style="width:100px;height:100px;font-size:3rem;background:linear-gradient(135deg,var(--primary),var(--accent))">
                ?</div>
              <span id="profileStatusBadge"
                class="position-absolute bottom-0 end-0 p-2 bg-success border border-light rounded-circle"
                style="transform:translate(-10%, -10%)" title="Online"></span>
            </div>
            <h3 id="profileName" class="fw-800 mb-1">...</h3>
            <p id="profileEmail" style="color:var(--text-muted)"><i class="bi bi-envelope-fill me-2"></i>...</p>
            <div class="d-flex justify-content-center gap-3 mt-4">
              <button class="btn btn-primary-custom px-4" id="chatBtn" onclick="initChat()"><i
                  class="bi bi-chat-dots-fill me-2"></i>Message</button>
            </div>
          </div>

          <!-- Skills Card -->
          <div class="card-custom p-4">
            <h5 class="fw-700 mb-4 border-bottom pb-2"><i class="bi bi-lightning-charge me-2 text-warning"></i>Skill
              Profile</h5>

            <div class="mb-4">
              <h6 class="fw-bold mb-3" style="color:var(--text-muted)">Skills they can TEACH:</h6>
              <div id="teachesList" class="d-flex flex-wrap gap-2">
                <span class="text-muted fst-italic">Loading...</span>
              </div>
            </div>

            <div>
              <h6 class="fw-bold mb-3" style="color:var(--text-muted)">Skills they WANT TO LEARN:</h6>
              <div id="learnsList" class="d-flex flex-wrap gap-2">
                <span class="text-muted fst-italic">Loading...</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="firebase/firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script src="js/api.js"></script>
  <script src="components/chatbot.js"></script>
  <script>
    let targetUserId = new URLSearchParams(window.location.search).get('user_id');
    let loadedFirebaseUid = null;

    (async () => {
      try {
        if (!targetUserId) throw new Error("No user specified in URL.");

        const firebaseUser = await requireAuth(); // ensures we are logged in
        const data = await API.getUser(targetUserId); // fetches target user

        loadedFirebaseUid = data.firebase_uid;

        document.getElementById('loader').classList.add('d-none');
        document.getElementById('profileContent').classList.remove('d-none');

        // Render
        document.getElementById('profileName').textContent = data.name;
        document.getElementById('profileEmail').textContent = data.email;
        document.getElementById('profileInitial').textContent = data.name.charAt(0).toUpperCase();

        // Status
        const badge = document.getElementById('profileStatusBadge');
        if (data.is_currently_online == 1) {
          badge.className = 'position-absolute bottom-0 end-0 p-2 bg-success border border-light rounded-circle';
          badge.title = 'Online';
        } else {
          badge.className = 'position-absolute bottom-0 end-0 p-2 bg-secondary border border-light rounded-circle';
          badge.title = 'Offline';
        }

        // Load their skills
        try {
          const skillsData = await API.getUserSkills(loadedFirebaseUid);
          const teaches = skillsData.filter(s => s.type === 'teach');
          const learns = skillsData.filter(s => s.type === 'learn');

          const teachHtml = teaches.length
            ? teaches.map(s => `<span class="badge-skill px-3 py-2"><i class="bi bi-star-fill text-warning me-2"></i>${s.skill_name} (${s.level})</span>`).join('')
            : '<span class="text-muted fst-italic">No skills listed yet</span>';

          const learnHtml = learns.length
            ? learns.map(s => `<span class="badge-skill px-3 py-2" style="background:var(--bg-secondary);border-color:var(--border)"><i class="bi bi-book me-2"></i>${s.skill_name} (${s.level})</span>`).join('')
            : '<span class="text-muted fst-italic">No goals listed yet</span>';

          document.getElementById('teachesList').innerHTML = teachHtml;
          document.getElementById('learnsList').innerHTML = learnHtml;
        } catch (skillErr) {
          console.warn("Could not load skills for user");
          document.getElementById('teachesList').innerHTML = '<span class="text-muted">Unavailable</span>';
          document.getElementById('learnsList').innerHTML = '<span class="text-muted">Unavailable</span>';
        }

      } catch (e) {
        document.getElementById('loader').classList.add('d-none');
        document.getElementById('errorDisplay').classList.remove('d-none');
        document.getElementById('errorMsg').textContent = e.message || "Failed to load profile";
      }
    })();

    function initChat() {
      if (!loadedFirebaseUid) return;
      window.location.href = 'chat.html?chat_with=' + loadedFirebaseUid;
    }
  </script>
</body>

</html>
